version: '3.9'

services:
  # ── PostgreSQL (local dev only — no PgBouncer) ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cureka_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cureka_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cureka_db']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cureka_dev_network

volumes:
  postgres_dev_data:
    driver: local

networks:
  cureka_dev_network:
    driver: bridge
