version: '3.9'

services:
  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cureka_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - cureka_network

  # ── Worker ───────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cureka_worker
    restart: unless-stopped
    command: node dist/apps/worker/main
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-cureka_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cureka_network

  # ── Application ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cureka_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-cureka_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Shipway is required for both COD and confirmed prepaid orders.
      SHIPWAY_REQUIRED: ${SHIPWAY_REQUIRED:-true}
      SHIPWAY_EMAIL: ${SHIPWAY_EMAIL}
      SHIPWAY_LICENSE_KEY: ${SHIPWAY_LICENSE_KEY}
      SHIPWAY_BASE_URL: ${SHIPWAY_BASE_URL:-https://app.shipway.com}
      SHIPWAY_WAREHOUSE_ID: ${SHIPWAY_WAREHOUSE_ID:-}
      SHIPWAY_RETURN_WAREHOUSE_ID: ${SHIPWAY_RETURN_WAREHOUSE_ID:-}
      SHIPWAY_CARRIER_ID: ${SHIPWAY_CARRIER_ID:-}
      SHIPWAY_WEBHOOK_SECRET: ${SHIPWAY_WEBHOOK_SECRET:-}
      SHIPWAY_TIMEOUT_MS: ${SHIPWAY_TIMEOUT_MS:-15000}
      SHIPWAY_DEFAULT_WEIGHT_GRAMS: ${SHIPWAY_DEFAULT_WEIGHT_GRAMS:-500}
      SHIPWAY_DEFAULT_LENGTH_CM: ${SHIPWAY_DEFAULT_LENGTH_CM:-10}
      SHIPWAY_DEFAULT_BREADTH_CM: ${SHIPWAY_DEFAULT_BREADTH_CM:-10}
      SHIPWAY_DEFAULT_HEIGHT_CM: ${SHIPWAY_DEFAULT_HEIGHT_CM:-5}
      # File storage — set STORAGE_DRIVER=gcs in production (blog, banners, products, etc.)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-gcs}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_IMAGE_FILE_SIZE: ${UPLOAD_MAX_IMAGE_FILE_SIZE:-1048576}
      UPLOAD_MAX_VIDEO_FILE_SIZE: ${UPLOAD_MAX_VIDEO_FILE_SIZE:-20971520}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-/app/secrets/gcs-service-account.json}
      GCS_SIGNED_URL_TTL_SECONDS: ${GCS_SIGNED_URL_TTL_SECONDS:-3600}
    volumes:
      - ${GCS_CREDENTIALS_HOST_PATH:-./secrets/gcs-service-account.json}:${GCS_CREDENTIALS_PATH:-/app/secrets/gcs-service-account.json}:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - cureka_network

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cureka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cureka_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cureka_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cureka_network

  # ── PgBouncer ─────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: cureka_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cureka_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cureka_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cureka_network:
    driver: bridge
