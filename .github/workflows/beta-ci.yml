# =============================================================================
# beta-ci.yml
# -----------------------------------------------------------------------------
# CI for the development branch only.
#
# Desired flow:
#   feature/* → development → Beta CI (this workflow)
#   merge into beta_development → Beta Deploy (beta-deploy.yml only)
#
# Does NOT run on beta_development (avoids CI+Deploy on the same merge).
# =============================================================================

name: Beta CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

concurrency:
  group: beta-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build NestJS application
        run: npm run build

      - name: Verify build artifact
        run: |
          test -f dist/apps/api/main.js
          echo "Artifact OK: dist/apps/api/main.js"
