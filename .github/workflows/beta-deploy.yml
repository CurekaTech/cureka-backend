# =============================================================================
# beta-deploy.yml
# -----------------------------------------------------------------------------
# Continuous Delivery for the beta track.
#
# On every push/merge to beta_development, SSH into the Debian VM and run
# scripts/deploy-beta.sh (git reset, conditional npm ci/build, migrations,
# PM2 reload, health check).
#
# Required repository secrets:
#   BETA_SSH_HOST, BETA_SSH_USER, BETA_SSH_PRIVATE_KEY
#
# Optional secrets or variables:
#   BETA_SSH_PORT (default 22)
#   BETA_DEPLOY_PATH (default /var/www/Cureka-backend)
#   BETA_HEALTH_CHECK_URL (default: http://127.0.0.1:<PORT>/api/v1/health on VM)
# =============================================================================

name: Beta Deploy

on:
  push:
    branches:
      - beta_development

  workflow_dispatch:
    inputs:
      force_npm_ci:
        description: 'Force npm ci even if package-lock.json unchanged'
        required: false
        type: boolean
        default: false
      force_build:
        description: 'Force nest build even if sources unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  # Prevent two merges from deploying at once; cancel the older run.
  group: beta-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Beta VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate required secrets
        env:
          BETA_SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          BETA_SSH_USER: ${{ secrets.BETA_SSH_USER }}
          BETA_SSH_PRIVATE_KEY: ${{ secrets.BETA_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in BETA_SSH_HOST BETA_SSH_USER BETA_SSH_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Resolve deploy configuration
        id: cfg
        env:
          SECRET_PATH: ${{ secrets.BETA_DEPLOY_PATH }}
          VAR_PATH: ${{ vars.BETA_DEPLOY_PATH }}
          SECRET_PORT: ${{ secrets.BETA_SSH_PORT }}
          VAR_PORT: ${{ vars.BETA_SSH_PORT }}
          SECRET_HEALTH: ${{ secrets.BETA_HEALTH_CHECK_URL }}
          VAR_HEALTH: ${{ vars.BETA_HEALTH_CHECK_URL }}
          FORCE_NPM_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.force_npm_ci || false }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || false }}
        run: |
          DEPLOY_PATH="${VAR_PATH:-${SECRET_PATH:-/var/www/Cureka-backend}}"
          SSH_PORT="${VAR_PORT:-${SECRET_PORT:-22}}"
          HEALTH_CHECK_URL="${VAR_HEALTH:-${SECRET_HEALTH:-}}"

          EXTRA_FLAGS=""
          if [[ "${FORCE_NPM_CI}" == "true" ]]; then
            EXTRA_FLAGS+=" --force-npm-ci"
          fi
          if [[ "${FORCE_BUILD}" == "true" ]]; then
            EXTRA_FLAGS+=" --force-build"
          fi

          {
            echo "deploy_path=${DEPLOY_PATH}"
            echo "ssh_port=${SSH_PORT}"
            echo "health_check_url=${HEALTH_CHECK_URL}"
            echo "extra_flags=${EXTRA_FLAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: SSH deploy (execute deploy-beta.sh)
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BETA_SSH_HOST }}
          username: ${{ secrets.BETA_SSH_USER }}
          key: ${{ secrets.BETA_SSH_PRIVATE_KEY }}
          port: ${{ steps.cfg.outputs.ssh_port }}
          script_stop: true
          command_timeout: 14m
          envs: DEPLOY_PATH,HEALTH_CHECK_URL,EXTRA_FLAGS,GH_ACTOR,GH_SHA,GH_RUN_URL
          script: |
            set -euo pipefail

            cd "${DEPLOY_PATH}"
            chmod +x scripts/deploy-beta.sh scripts/health-check.sh
            mkdir -p logs

            if [[ -n "${HEALTH_CHECK_URL:-}" ]]; then
              export HEALTH_CHECK_URL
            fi

            echo "==== GitHub Actions beta deploy ===="
            echo "Triggered by: ${GH_ACTOR}"
            echo "Commit: ${GH_SHA}"
            echo "Run: ${GH_RUN_URL}"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            set +e
            # shellcheck disable=SC2086
            ./scripts/deploy-beta.sh ${EXTRA_FLAGS} 2>&1 | tee -a logs/last-deploy.log
            rc=${PIPESTATUS[0]}
            set -e
            exit "${rc}"
        env:
          DEPLOY_PATH: ${{ steps.cfg.outputs.deploy_path }}
          HEALTH_CHECK_URL: ${{ steps.cfg.outputs.health_check_url }}
          EXTRA_FLAGS: ${{ steps.cfg.outputs.extra_flags }}
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Deployment summary
        if: always()
        env:
          SSH_OUTCOME: ${{ steps.ssh_deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_PATH: ${{ steps.cfg.outputs.deploy_path }}
        run: |
          STATUS_ICON="failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            STATUS_ICON="success"
          fi

          {
            echo "## Beta Deploy (${STATUS_ICON})"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${JOB_STATUS}\` |"
            echo "| SSH step | \`${SSH_OUTCOME}\` |"
            echo "| Branch | \`beta_development\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Actor | \`${{ github.actor }}\` |"
            echo "| Deploy path | \`${DEPLOY_PATH}\` |"
            echo "| Host | \`${{ secrets.BETA_SSH_HOST }}\` |"
            echo "| Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Behaviour"
            echo ""
            echo "- \`npm ci\` only when package-lock changes"
            echo "- \`npm run migration:run\` before PM2 reload"
            echo "- \`pm2 reload ecosystem.config.js --update-env\`"
            echo "- Health: \`GET /api/v1/health\` → HTTP 200"
            echo "- On-box log: \`${DEPLOY_PATH}/logs/last-deploy.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${JOB_STATUS}" != "success" ]]; then
            echo "::error::Beta deployment failed — inspect the SSH deploy step and VM logs/last-deploy.log"
            exit 1
          fi
