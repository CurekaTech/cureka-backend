name: Backend Beta Deploy

on:
  push:
    branches:
      - beta_development

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-beta-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: cureka-501005
  GCP_ZONE: asia-south1-c
  GCP_VM_NAME: cureka-beta-v
  GCP_WIF_PROVIDER: projects/467987608148/locations/global/workloadIdentityPools/github-cureka/providers/github-cureka-provider
  GCP_DEPLOY_SA: github-cureka-deploy@cureka-501005.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy Backend to Beta
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify WIF authentication
        run: |
          set -euo pipefail

          echo "Active Google Cloud account:"

          gcloud auth list \
            --filter=status:ACTIVE \
            --format="value(account)"

          echo "Checking target VM:"

          gcloud compute instances describe "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format="table(name,status)"

      - name: Deploy Backend through IAP
        if: >
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[auth-only]')
        run: |
          set -euo pipefail

          echo "Starting Cureka Backend deployment"
          echo "Commit: ${GITHUB_SHA}"

          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="sudo -u tech -H bash -lc '
              set -euo pipefail

              export NVM_DIR=/home/tech/.nvm
              source /home/tech/.nvm/nvm.sh
              nvm use 22

              cd /var/www/Cureka-backend

              chmod +x scripts/deploy-beta.sh

              echo \"========================================\"
              echo \"CUREKA BACKEND WIF/IAP DEPLOYMENT\"
              echo \"========================================\"
              echo \"Runtime user: \$(whoami)\"
              echo \"Node: \$(node -v)\"
              echo \"npm: \$(npm -v)\"
              echo \"Started UTC: \$(date -u +%Y-%m-%dT%H:%M:%SZ)\"

              ./scripts/deploy-beta.sh
            '"

      - name: Verify Backend after deployment
        if: >
          success() &&
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[auth-only]')
        run: |
          set -euo pipefail

          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="sudo -u tech -H bash -lc '
              set -euo pipefail

              export NVM_DIR=/home/tech/.nvm
              source /home/tech/.nvm/nvm.sh

              echo \"Checking PM2 backend processes\"

              pm2 describe cureka-backend >/dev/null

              echo \"Checking backend health endpoint\"

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                http://127.0.0.1:3000/api/v1/health >/dev/null

              echo \"Backend verification successful\"
            '"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Cureka Backend Beta"
            echo ""
            echo "- Status: \`${{ job.status }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Authentication: GitHub OIDC → GCP WIF"
            echo "- SSH: IAP + OS Login"
            echo "- Runtime user: tech"
            echo "- PM2 target: cureka-backend only"
            echo "- Health: /api/v1/health"
            echo "- Image worker: not touched"
            echo "- Frontend: not touched"
            echo "- Admin: not touched"
          } >> "$GITHUB_STEP_SUMMARY"
